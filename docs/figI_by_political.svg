<text x="18.0" y="40.0" font-size="9.5" text-anchor="start" fill="#D55E00" font-weight="normal">Each dot = one per-subgroup RATE (share of the group&#x27;s OWN activity that is misinfo). Diamond = median. Colour = definition. NOT concentration.</text>
<text x="18.0" y="53.0" font-size="9" text-anchor="start" fill="#888" font-weight="normal">Party placements follow conventional left-right classification (Chapel-Hill-Expert-Survey / ParlGov consensus: FN/AfD/FdI=far-right, LFI/Die-Linke=far-left, LR/Lega/CDU=right, PS/Labour=left, REM=center).</text>
<text x="18.0" y="65.0" font-size="9" text-anchor="start" fill="#888" font-weight="normal">&#x27;mixed&#x27; = independents / mixed groups / non-partisan — NOT a point on the left-right axis, so shown separately below the line.</text>
