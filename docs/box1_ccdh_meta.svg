<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Georgia,serif">
<rect width="760" height="400" fill="#fcfcfb"/>
<rect x="0" y="0" width="760" height="6" fill="#2c2a26"/>
<text x="44" y="46" font-size="21" font-weight="bold" fill="#2c2a26">Box 1 · One numerator, two denominators</text>
<text x="44" y="70" font-size="14.5" fill="#6b655c">The same twelve anti-vaccine accounts (the &#8220;Disinformation Dozen&#8221;), measured two ways:</text>
<text x="44" y="114" font-size="13" fill="#6b655c" font-family="Georgia,serif" letter-spacing="0.3">CCDH (advocacy) &#183; share of a CURATED sample of shared anti-vaccine content</text>
<rect x="44" y="126" width="672" height="34" rx="4" fill="#ece7db"/>
<rect x="44" y="126" width="436.8" height="34" rx="4" fill="#D55E00"/>
<text x="468.8" y="149.0" font-size="22" font-weight="bold" fill="#fff" text-anchor="end" font-family="Georgia,serif">65%</text>
<text x="716" y="178" font-size="12.5" fill="#6b655c" text-anchor="end" font-family="Georgia,serif">100% = anti-vaccine posts hand-collected for the report</text>
<text x="44" y="212" font-size="13" fill="#6b655c" font-family="Georgia,serif" letter-spacing="0.3">Meta (platform) &#183; share of what users ACTUALLY SAW in their feeds</text>
<rect x="44" y="224" width="672" height="34" rx="4" fill="#ece7db"/>
<rect x="44" y="224" width="3.0" height="34" rx="4" fill="#0072B2"/>
<text x="57.0" y="248.0" font-size="22" font-weight="bold" fill="#0072B2" font-family="Georgia,serif">0.05%</text>
<text x="121.0" y="247.0" font-size="12.5" fill="#6b655c" font-style="italic" font-family="Georgia,serif">&#8592; essentially invisible at true scale</text>
<text x="716" y="276" font-size="12.5" fill="#6b655c" text-anchor="end" font-family="Georgia,serif">100% = all content shown to Facebook/Instagram users</text>
<line x1="44" y1="292" x2="716" y2="292" stroke="#e0d7c4" stroke-width="1"/>
<text x="44" y="322" font-size="16" fill="#2c2a26"><tspan font-weight="bold" font-size="20">&#215;1,300</tspan><tspan fill="#6b655c">  &#8212; three orders of magnitude, from the denominator alone.</tspan></text>
<text x="44" y="350" font-size="13" fill="#6b655c" font-style="italic">Both figures are arithmetically correct. The numerator (the twelve accounts) is identical;</text>
<text x="44" y="368" font-size="13" fill="#6b655c" font-style="italic">only the denominator &#8212; a share of <tspan font-style="normal" font-weight="bold">what?</tspan> &#8212; changed.</text>
</svg>