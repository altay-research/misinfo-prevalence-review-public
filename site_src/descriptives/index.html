<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descriptives</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head><body>
<main class="wrap">
  <h1>Descriptives</h1>
  <p class="lede">Every figure in the review, and what the {{N_STUDIES}} studies and
     {{N_EST}} estimates are made of.</p>

  <h2>Figures</h2>
  <div id="figures"></div>

  <h2>What the corpus is made of</h2>
  <div id="codebook"></div>
</main>

<script type="module">
import { data, setMeta, mountChrome, mountFooter, esc, fieldLabel, valueLabel, num,
         constructName, mountContributeCTA } from '../assets/site.js';
mountChrome('descriptives/');
const d = await data(); setMeta(d.meta); mountContributeCTA(d.meta); mountFooter(d.meta);

// Every figure in the article, in its own numbering, with the article's own captions. Both come
// from make_nhb_docx.py via the build script, so the site cannot carry a figure the paper does not.
document.getElementById('figures').innerHTML = (d.meta.figures || [])
  .filter(f => f.where === 'descriptives')
  .map(f => `
  <figure id="${f.kind === 'supplementary' ? 'supp-fig-' : 'fig-'}${f.n}">
    <img src="../figures/${esc(f.file)}" alt="${esc(f.label)}">
    <figcaption><strong>${esc(f.label)}.</strong> ${esc(f.caption)}
      <a href="../figures/${esc(f.file)}" download>SVG</a></figcaption>
  </figure>`).join('');

// Corpus composition, drawn rather than tabulated: one bar per level, share of estimates.
// Percentages lead and the denominator is stated once, per the house figure convention.
const TOTAL = d.meta.n_estimates;

const counts = (f, pool) => {
  const m = new Map();
  for (const e of (pool || d.estimates)) { const v = e[f]; if (!v) continue; m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
};

function bars(rows, total, order, name) {
  if (!rows.length) return '';
  if (order) rows.sort((a, b) => {
    const r = k => { const i = order.indexOf(k); return i < 0 ? 99 : i; };
    return r(a[0]) - r(b[0]);
  });
  const max = Math.max(...rows.map(r => r[1]));
  const W = 660, padL = 220, padR = 74, rowH = 26, H = rows.length * rowH + 16;
  const body = rows.map(([v, n], i) => {
    const y = i * rowH + 8, w = Math.max((n / max) * (W - padL - padR), 1.5);
    return `<text x="${padL - 12}" y="${y + 13}" text-anchor="end" font-size="12.5" fill="#2b2f36">${esc(name(v))}</text>` +
           `<rect x="${padL}" y="${y + 3}" width="${w}" height="13" rx="2.5" fill="#0072B2" fill-opacity=".85"/>` +
           `<text x="${padL + w + 8}" y="${y + 13.5}" font-size="11.5" font-family="var(--mono)" fill="#646b76">` +
           `${(100 * n / total).toFixed(1)}%</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" height="${H}" style="width:100%;max-width:${W}px;border:0;background:none" role="img">${body}</svg>`;
}

const blocks = d.meta.controls.map(f => `
  <h3>${esc(fieldLabel(f))}</h3>
  ${bars(counts(f), TOTAL,
         f === 'construct' ? d.meta.construct_order : null,
         v => f === 'construct' ? constructName(v) : valueLabel(v, f))}`).join('');

// Risk of bias is a study-level appraisal, so it is counted over studies, not estimates.
const robRows = [...Object.values(d.studies).reduce((m, s) => m.set(s.rob, (m.get(s.rob) || 0) + 1), new Map())];
const robBlock = `<h3>Risk of bias</h3>
  ${bars(robRows, d.meta.n_studies, ['LOW', 'MODERATE', 'HIGH'], v => String(v).toLowerCase())}
  <p class="small muted">Counted over the ${d.meta.n_studies} studies; every other chart here is
     over the ${num(TOTAL)} estimates.</p>`;

document.getElementById('codebook').innerHTML = blocks + robBlock;
</script>
</body></html>
