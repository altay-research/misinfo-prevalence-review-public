<!DOCTYPE html><html lang="en" data-v="{{DATA_V}}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The {{N_STUDIES}} included studies</title>
<meta name="description" content="Every one of the {{N_STUDIES}} included studies, with the estimates it contributed and the full record of each.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head><body>
<main class="wrap">
  <h1>The {{N_STUDIES}} included studies</h1>
  <p class="lede">Every study in the review, with the estimates it contributed. Open one to read
     each estimate's record.</p>

  <div class="bar">
    <div class="grow"><input type="search" id="q" placeholder="Search author, title, venue, country…"></div>
    <select id="con"><option value="">any construct</option></select>
    <select id="rob"><option value="">any risk of bias</option>
      <option>LOW</option><option>MODERATE</option><option>HIGH</option></select>
    <select id="sort">
      <option value="author">by author</option>
      <option value="year">newest first</option>
      <option value="n">most estimates first</option>
    </select>
    <label class="small muted" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="mainonly"> main analysis set only</label>
  </div>

  <p class="small muted" id="count"></p>
  <table class="grid"><thead><tr>
    <th>Study</th><th>Venue</th><th>Country</th><th>Platform</th>
    <th>Measures</th><th class="n">Estimates</th><th>Risk of bias</th>
  </tr></thead><tbody id="rows"></tbody></table>
  <p style="text-align:center;margin:20px 0"><button class="btn" id="more" hidden>show more</button></p>
</main>

<script type="module">
import { data, setMeta, mountChrome, mountFooter, recordHTML, esc,
         constructName, wireCopy, humanise, clip, num, plural, mountContributeCTA, matchesQuery , addPaperLink , rescueEstimateLink } from '../assets/site.js';
if (rescueEstimateLink()) throw new Error('redirecting');
mountChrome('studies/');
const d = await data(); setMeta(d.meta); addPaperLink(d.meta); mountContributeCTA(d.meta); mountFooter(d.meta); wireCopy(document, d.meta);

// Counted from the estimates rather than from the study record's own totals, so that
// "main analysis set only" can restrict them. Without it this page reported 20 exposure studies
// while the overview's tile reported 18 — both true, different denominators, and exactly the
// confusion this review exists to name.
const constructsOf = (id, mainOnly) => {
  const rows = (d.byStudy.get(id) || []).filter(e => !mainOnly || (e.main && e.value != null));
  return { constructs: [...new Set(rows.map(e => e.construct))], n: rows.length };
};
const list = Object.entries(d.studies).map(([id, s]) => ({ id, ...s }));
const state = { q: '', con: '', rob: '', sort: 'author', mainonly: false, limit: 50 };

document.getElementById('con').innerHTML += d.meta.construct_order
  .map(c => `<option value="${c}">${esc(constructName(c))}</option>`).join('');

document.getElementById('mainonly').addEventListener('change', e => {
  state.mainonly = e.target.checked; state.limit = 50; render();
});
for (const [id, key] of [['q', 'q'], ['con', 'con'], ['rob', 'rob'], ['sort', 'sort']]) {
  const el = document.getElementById(id);
  el.addEventListener(id === 'q' ? 'input' : 'change', e => {
    state[key] = id === 'q' ? e.target.value.trim() : e.target.value;
    state.limit = 50; render();
  });
}
document.getElementById('more').addEventListener('click', () => { state.limit += 100; render(); });

function matches(s) {
  if (state.rob && s.rob !== state.rob) return false;
  const c = constructsOf(s.id, state.mainonly);
  s._n = c.n; s._constructs = c.constructs;
  if (state.mainonly && c.n === 0) return false;
  if (state.con && !c.constructs.includes(state.con)) return false;
  if (state.q) {
    const hay = [s.author, s.year, s.title, s.venue, s.country, s.platform, s.id].join(' ');
    if (!matchesQuery(hay, state.q)) return false;
  }
  return true;
}

function render() {
  let hits = list.filter(matches);
  if (state.sort === 'author') hits.sort((a, b) => (a.author || '').localeCompare(b.author || ''));
  else if (state.sort === 'year') hits.sort((a, b) => (b.year || '').localeCompare(a.year || ''));
  else hits.sort((a, b) => b._n - a._n);

  document.getElementById('count').textContent =
    `${plural(hits.length, 'study', 'studies')} · ${plural(hits.reduce((n, s) => n + s._n, 0), 'estimate')}`;
  document.getElementById('rows').innerHTML = hits.slice(0, state.limit).map(s => `
    <tr class="clickable" data-id="${esc(s.id)}">
      <td><strong>${esc(s.author)} ${esc(s.year)}</strong>
        <div class="small muted">${esc(clip(s.title, 95))}</div></td>
      <td class="small">${esc(clip(s.venue, 34))}</td>
      <td class="small">${esc(clip(humanise(s.country), 26))}</td>
      <td class="small">${esc(clip(humanise(s.platform), 24))}</td>
      <td class="small muted">${esc(s._constructs.map(constructName).join(' · '))}</td>
      <td class="n">${s._n}</td>
      <td><span class="badge ${esc(s.rob)}">${esc((s.rob || '').toLowerCase())}</span></td>
    </tr>`).join('');
  document.getElementById('more').hidden = hits.length <= state.limit;
}

// A study's estimates open UNDER its own row. They used to render in a panel below the table and
// scroll there, so opening a study far down the list threw you out of your place in it.
function rowFor(id) { return document.querySelector(`tr[data-id="${CSS.escape(id)}"]`); }

function collapse() {
  for (const tr of document.querySelectorAll('tr.rec-open')) {
    tr.classList.remove('rec-open');
    if (tr.nextElementSibling?.classList.contains('rec-row')) tr.nextElementSibling.remove();
  }
}

/* A link to an identifier no study carries used to do nothing; say so above the list. */
function notFound(id) {
  document.querySelector('.notice-missing')?.remove();
  document.getElementById('rows').closest('table').insertAdjacentHTML('beforebegin',
    `<p class="notice-missing" role="status">No study carries the identifier <code>${id.replace(/[^0-9A-Za-z._\-]/g, '')}</code>. ` +
    `The link may be mistyped, or the study left the dataset in a later freeze. The full list is below.</p>`);
}

function open(id, { scroll = false } = {}) {
  collapse();
  document.querySelector('.notice-missing')?.remove();
  const st = d.studies[id];
  const rows = (d.byStudy.get(id) || []).filter(e => !state.mainonly || (e.main && e.value != null));
  if (!st) { notFound(id); return; }
  if (!rows.length) return;
  // the row may be filtered out or past the "show more" cut
  if (!rowFor(id)) {
    if (!matches({ id, ...st })) {
      state.q = ''; state.con = ''; state.rob = '';
      document.getElementById('q').value = '';
      document.getElementById('con').value = '';
      document.getElementById('rob').value = '';
    }
    let guard = 0;
    do { state.limit += 200; render(); } while (!rowFor(id) && ++guard < 10);
  }
  const tr = rowFor(id);
  if (!tr) return;
  tr.classList.add('rec-open');
  tr.insertAdjacentHTML('afterend',
    `<tr class="rec-row"><td colspan="7">` +
    `<p class="small muted rec-head">${plural(rows.length, 'estimate')}` +
    (st.doi ? ` · <a href="https://doi.org/${esc(st.doi)}" target="_blank" rel="noopener">doi.org/${esc(st.doi)}</a>` : '') +
    `</p>` +
    // One estimate opens in full. Several are listed one line each, the full record on click:
    // nine full records at once was a wall, and the value with its construct is what a reader
    // scans a study for.
    (rows.length === 1
      ? recordHTML(rows[0], d.studies, { siblings: 1, repo: d.meta.repo, endpoint: d.meta.submit_endpoint })
      : `<div class="est-list">` + rows.map(e => `
          <div class="est-line" data-eid="${esc(e.eid)}" role="button" tabindex="0" aria-expanded="false">
            <b>${e.value != null ? esc(e.value) + '%' : esc(clip(e.value_raw || '—', 14))}</b>
            <span class="con">${esc(constructName(e.construct))}</span>
            <span class="what small muted">${esc(e.measure_type || e.denominator || '')}</span>
            <span class="arw">&#9656;</span>
          </div><div class="est-rec" hidden></div>`).join('') + `</div>`) +
    `</td></tr>`);
  if (scroll) tr.scrollIntoView({ block: 'center' });
}

function toggleLine(line) {
  const box = line.nextElementSibling;
  if (!box.hidden) { box.hidden = true; box.innerHTML = ''; line.setAttribute('aria-expanded', 'false'); return; }
  const e = d.byEid.get(line.dataset.eid);
  if (!e) return;
  box.innerHTML = recordHTML(e, d.studies, { siblings: (d.byStudy.get(e.id) || []).length,
                                              repo: d.meta.repo, endpoint: d.meta.submit_endpoint });
  box.hidden = false; line.setAttribute('aria-expanded', 'true');
}
document.getElementById('rows').addEventListener('click', ev => {
  const line = ev.target.closest('.est-line');
  if (line) toggleLine(line);
});
document.getElementById('rows').addEventListener('keydown', ev => {
  const line = ev.target.closest('.est-line');
  if (line && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggleLine(line); }
});

document.getElementById('rows').addEventListener('click', ev => {
  if (ev.target.closest('.rec-row')) return;          // clicks inside an open study are its own
  const tr = ev.target.closest('tr[data-id]');
  if (!tr) return;
  const id = tr.dataset.id;
  const wasOpen = tr.classList.contains('rec-open');
  collapse();
  // replaceState, not location.hash: assigning a hash makes the browser jump to the element with
  // that id, which is exactly the scroll this replaced.
  if (wasOpen) history.replaceState(null, '', location.pathname + location.search);
  else { open(id); history.replaceState(null, '', '#' + encodeURIComponent(id)); }
});
addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) open(h, { scroll: true }); else collapse();
});
render();
if (location.hash) open(decodeURIComponent(location.hash.slice(1)), { scroll: true });
</script>
</body></html>
