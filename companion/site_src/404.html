<!DOCTYPE html><html lang="en" data-v="{{DATA_V}}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="{{SITE_PATH}}favicon.svg" type="image/svg+xml">

</head><body>
<main class="wrap">

  <nav class="go">
    <a class="go-btn primary" href="{{SITE_PATH}}">Overview <span class="arw">&rarr;</span></a>
    <a class="go-btn" href="{{SITE_PATH}}explore/">Explore</a>
    <a class="go-btn" href="{{SITE_PATH}}estimates/">Estimates</a>
    <a class="go-btn" href="{{SITE_PATH}}studies/">Studies</a>

    <a class="go-btn" href="{{SITE_PATH}}data/">Data</a>
  </nav>
</main>
<script type="module">
  // GitHub Pages serves this file at whatever address was missing, so its links are absolute.
  import { mountChrome, mountFooter, meta, addPaperLink } from '{{SITE_PATH}}assets/site.js';
  mountChrome('');
  meta().then(m => { addPaperLink(m); mountFooter(m); });
</script>
</body></html>
