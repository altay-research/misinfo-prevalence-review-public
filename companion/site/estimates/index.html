<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inspect every estimate</title>
<meta name="description" content="All 1,048 estimates from 443 studies, each with the sentence it was taken from, what it is a share of, and how every field was coded.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head><body>
<main class="wrap">
  <h1>Inspect every estimate</h1>
  <p class="lede">All 1,048 estimates. Open any one to see the sentence it was taken from, what
     it is a share of, and how every field was coded.</p>

  <div class="bar">
    <div class="grow"><input type="search" id="q" placeholder="Search study, title, quote, denominator…"></div>
    <select id="sort">
      <option value="construct">by construct</option>
      <option value="study">by study</option>
      <option value="value_desc">highest value first</option>
      <option value="value_asc">lowest value first</option>
    </select>
    <label class="small muted" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="mainonly" checked> main analysis set only</label>
    <button class="btn" id="csv">download CSV</button>
  </div>

  <div class="cols">
    <aside class="side" id="filters"></aside>
    <div>
      <p class="small muted" id="count"></p>
      <table class="grid"><thead><tr>
        <th class="n">%</th><th>What</th><th>Study</th><th>Out of</th><th>Coded</th>
      </tr></thead><tbody id="rows"></tbody></table>
      <p style="text-align:center;margin:20px 0"><button class="btn" id="more" hidden>show more</button></p>
    </div>
  </div>
</main>

<script type="module">
import { data, setMeta, mountChrome, mountFooter, recordHTML, esc,
         valueLabel, constructName, fieldLabel, wireCopy, clip, num, plural, mountContributeCTA, matchesQuery, addPaperLink,
         decodeFilters, writeFilters, wireShare } from '../assets/site.js';

mountChrome('estimates/');
const d = await data();
setMeta(d.meta); addPaperLink(d.meta);
mountContributeCTA(d.meta);
mountFooter(d.meta);
wireCopy(document, d.meta);

const FIELDS = d.meta.controls;
// The filters live in the URL, so a slice can be sent to someone. An estimate permalink
// (#<eid>) still wins: it is a different kind of link and opening a record is what it is for.
const isRecordLink = /^#[0-9a-f]{6,}$/.test(location.hash);
const restored = isRecordLink ? { sel: {}, extra: {} } : decodeFilters(d.meta.controls);
const state = {
  q: restored.extra.q || '',
  sort: restored.extra.sort || 'construct',
  mainonly: restored.extra.all !== '1',
  on: restored.sel,
  limit: 60,
};

function syncURL() {
  if (/^#[0-9a-f]{6,}$/.test(location.hash)) return;   // a record is open; leave its link alone
  writeFilters(state.on, {
    q: state.q,
    sort: state.sort === 'construct' ? '' : state.sort,
    all: state.mainonly ? '' : '1',
  });
}
const uniq = f => [...new Set(d.estimates.map(e => e[f]).filter(Boolean))].sort();

// ---- filters
const fbox = document.getElementById('filters');
const levels = f => {
  if (f !== 'construct') return uniq(f);
  const rank = k => { const i = d.meta.construct_order.indexOf(k); return i < 0 ? 99 : i; };
  return uniq(f).sort((a, b) => rank(a) - rank(b));
};
const levelName = (f, v) => f === 'construct' ? constructName(v) : valueLabel(v, f);

fbox.innerHTML = FIELDS.map(f => {
  const vals = levels(f);
  if (vals.length < 2) return '';
  return `<div class="ctrl"><label>${esc(fieldLabel(f))}</label><div class="chips" data-f="${f}">` +
    vals.map(v => `<span class="chip" role="button" aria-pressed="false" data-v="${esc(v)}">${esc(levelName(f, v))}</span>`).join('') +
    `</div></div>`;
}).join('') +
  `<button class="btn" id="share" style="width:100%;margin-bottom:8px">copy link to this view</button>` +
  `<button class="btn" id="clear" style="width:100%">clear all filters</button>`;

for (const [f, on] of Object.entries(state.on)) {
  for (const v of on) {
    fbox.querySelector(`.chips[data-f="${f}"] .chip[data-v="${CSS.escape(v)}"]`)
      ?.setAttribute('aria-pressed', 'true');
  }
}
document.getElementById('q').value = state.q;
document.getElementById('sort').value = state.sort;
document.getElementById('mainonly').checked = state.mainonly;

fbox.addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if (chip) {
    const f = chip.closest('.chips').dataset.f, v = chip.dataset.v;
    const on = state.on[f] = state.on[f] || new Set();
    on.has(v) ? on.delete(v) : on.add(v);
    if (!on.size) delete state.on[f];
    chip.setAttribute('aria-pressed', String(on.has(v)));
    state.limit = 60; render(); syncURL();
  }
  if (ev.target.id === 'clear') {
    state.on = {}; state.limit = 60; state.q = ''; document.getElementById('q').value = '';
    fbox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    render(); syncURL();
  }
});

document.getElementById('q').addEventListener('input', e => {
  state.q = e.target.value.trim(); state.limit = 60; render(); syncURL();
});
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); syncURL(); });
document.getElementById('mainonly').addEventListener('change', e => {
  state.mainonly = e.target.checked; state.limit = 60; render(); syncURL();
});
document.getElementById('more').addEventListener('click', () => { state.limit += 120; render(); });

function matches(e) {
  if (state.mainonly && !e.main) return false;
  for (const [f, on] of Object.entries(state.on)) if (!on.has(e[f])) return false;
  if (state.q) {
    const st = d.studies[e.id] || {};
    const hay = [e.title, st.title, st.author, st.year, st.venue, e.quote, e.denominator,
                 e.measure_type, e.country, e.platform, e.id, e.eid].join(' ');
    if (!matchesQuery(hay, state.q)) return false;
  }
  return true;
}

function sorted(list) {
  const s = [...list];
  if (state.sort === 'value_desc') s.sort((a, b) => (b.value ?? -1) - (a.value ?? -1));
  else if (state.sort === 'value_asc') s.sort((a, b) => (a.value ?? 1e9) - (b.value ?? 1e9));
  else if (state.sort === 'study') s.sort((a, b) => {
    const A = d.studies[a.id] || {}, B = d.studies[b.id] || {};
    return (A.author || '').localeCompare(B.author || '') || (A.year || '').localeCompare(B.year || '');
  });
  else {
    const rank = k => { const i = d.meta.construct_order.indexOf(k); return i < 0 ? 99 : i; };
    s.sort((a, b) => rank(a.construct) - rank(b.construct) || (b.value ?? -1) - (a.value ?? -1));
  }
  return s;
}

function render() {
  const hits = sorted(d.estimates.filter(matches));
  document.getElementById('count').textContent =
    `${plural(hits.length, 'estimate')} from ${plural(new Set(hits.map(e => e.id)).size, 'study', 'studies')}`;
  const shown = hits.slice(0, state.limit);
  let lastGroup = null;
  document.getElementById('rows').innerHTML = shown.map(e => {
    const st = d.studies[e.id] || {};
    let head = '';
    if (state.sort === 'construct' && e.construct !== lastGroup) {
      lastGroup = e.construct;
      const k = hits.filter(x => x.construct === e.construct).length;
      head = `<tr class="grouphead"><td colspan="5">${esc(constructName(e.construct))}` +
             `<span>${num(k)} estimate${k === 1 ? '' : 's'}</span></td></tr>`;
    }
    return head + `<tr class="clickable" data-eid="${esc(e.eid)}">
      <td class="n"><strong>${e.value != null ? e.value + '%' : '—'}</strong></td>
      <td>${esc(constructName(e.construct))}<div class="small muted">${esc(clip(e.measure_type, 90))}</div></td>
      <td>${esc(st.author || '')} ${esc(st.year || '')}<div class="small muted">${esc(clip(st.title || e.title, 80))}</div></td>
      <td class="small">${esc(clip(e.denominator, 80))}</td>
      <td class="small muted">${esc(valueLabel(e.ground_truth, 'ground_truth'))} · ${esc(valueLabel(e.classification_level, 'classification_level'))}</td>
    </tr>`;
  }).join('');
  document.getElementById('more').hidden = hits.length <= state.limit;
}

// A record opens UNDER the row it belongs to. It used to render in a panel above the table and
// scroll there, so clicking the four-hundredth row threw you to the top and you lost your place.
function rowFor(eid) { return document.querySelector(`tr[data-eid="${CSS.escape(eid)}"]`); }

function collapse(eid) {
  const open = eid ? [rowFor(eid)] : [...document.querySelectorAll('tr.rec-open')];
  for (const tr of open) {
    if (!tr) continue;
    tr.classList.remove('rec-open');
    if (tr.nextElementSibling?.classList.contains('rec-row')) tr.nextElementSibling.remove();
  }
}

/* Open `eid` in place. `scroll` only when the reader did not click the row themselves — a pasted
 * link, or Back — because scrolling someone to a row they just clicked is the bug this replaced. */
/* A link to an identifier no estimate carries used to do nothing at all: the reader saw the full
 * list and no explanation. Say so, above the list, and clear the note on the next open. */
function notFound(eid) {
  document.querySelector('.notice-missing')?.remove();
  document.getElementById('rows').closest('table').insertAdjacentHTML('beforebegin',
    `<p class="notice-missing" role="status">No estimate carries the identifier <code>${eid.replace(/[^0-9a-z]/gi, '')}</code>. ` +
    `The link may be mistyped, or the estimate left the dataset in a later freeze. The full list is below.</p>`);
}

function open(eid, { scroll = false } = {}) {
  collapse();
  document.querySelector('.notice-missing')?.remove();
  const e = d.byEid.get(eid);
  if (!e) { notFound(eid); return; }
  // the row may be filtered out or past the "show more" cut; bring it into view of the list first
  if (!rowFor(eid)) {
    if (!matches(e)) {
      state.on = {}; state.q = ''; state.mainonly = e.main;
      document.getElementById('q').value = '';
      document.getElementById('mainonly').checked = state.mainonly;
      fbox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    }
    let guard = 0;
    do { state.limit += 200; render(); } while (!rowFor(eid) && ++guard < 20);
  }
  const tr = rowFor(eid);
  if (!tr) return;
  tr.classList.add('rec-open');
  tr.insertAdjacentHTML('afterend',
    `<tr class="rec-row"><td colspan="5">` +
    recordHTML(e, d.studies, { siblings: (d.byStudy.get(e.id) || []).length,
                               repo: d.meta.repo, endpoint: d.meta.submit_endpoint }) +
    `</td></tr>`);
  if (scroll) tr.scrollIntoView({ block: 'center' });
}

document.getElementById('rows').addEventListener('click', ev => {
  if (ev.target.closest('.rec-row')) return;          // clicks inside an open record are its own
  const tr = ev.target.closest('tr[data-eid]');
  if (!tr) return;
  const eid = tr.dataset.eid;
  const wasOpen = tr.classList.contains('rec-open');
  collapse();
  // replaceState, not location.hash: assigning the hash makes the browser jump to the element
  // with that id, which is the record itself — the very scroll we are trying to avoid.
  if (wasOpen) {
    history.replaceState(null, '', location.pathname + location.search);
  } else {
    open(eid);
    history.replaceState(null, '', '#' + eid);
  }
});
addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (/^[0-9a-f]{7,}$/.test(h)) open(h, { scroll: true }); else collapse();
});

document.getElementById('csv').addEventListener('click', () => {
  const cols = ['eid', 'id', 'value', 'construct', 'denominator', 'ground_truth', 'id_method',
                'classification_level', 'breadth', 'sampling', 'platform', 'country', 'n_raw', 'quote'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = d.estimates.filter(matches);
  const csv = [cols.join(',')].concat(rows.map(e => cols.map(c => q(e[c])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'misinfo_estimates_filtered.csv'; a.click();
});

wireShare(document.getElementById('share'));
render();
if (isRecordLink) open(location.hash.slice(1), { scroll: true });
</script>
</body></html>
