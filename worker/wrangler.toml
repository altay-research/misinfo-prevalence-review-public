name = "misinfo-prevalence-submit"
main = "index.js"
compatibility_date = "2026-09-18"

[vars]
SUBMISSIONS_REPO = "altay-research/misinfo-prevalence-submissions"
# Comma-separated. Add the custom domain here once it exists, and drop the github.io entry
# when the site moves, so the endpoint only accepts posts from pages you control.
ALLOWED_ORIGIN = "https://altay-research.github.io"

# Secrets live in Cloudflare, never in this file:
#   wrangler secret put GITHUB_TOKEN       fine-grained PAT, Issues read+write, submissions repo only
#   wrangler secret put TURNSTILE_SECRET   Cloudflare Turnstile secret key
